name: Build Desktop App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "server/**"
      - "mcp/**"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "brand-tokens.css"
      - "tests/desktop-runtime-paths.test.cjs"
      - "tests/brand-typography-parity.test.cjs"
      - ".github/workflows/build-desktop.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            mcp/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build packaged Python backend
        working-directory: desktop
        run: npm run build:python

      - name: Run desktop tests
        working-directory: desktop
        run: npm test

      - name: Run desktop runtime regression tests
        run: node --test tests/desktop-runtime-paths.test.cjs tests/brand-typography-parity.test.cjs

      - name: Build desktop artifacts
        working-directory: desktop
        run: npm run dist -- --publish never

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uptospeed-desktop-${{ matrix.os }}
          path: desktop/releases/**
          if-no-files-found: error
